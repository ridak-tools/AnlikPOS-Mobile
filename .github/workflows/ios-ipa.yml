name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 2. Build Web App
        run: |
          npm run build

      - name: 3. Add & Sync iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: 4. Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 5. Package IPA File
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app file not found!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r AnlikPOS-Mobile-iOS.ipa Payload

      - name: 6. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnlikPOS-Mobile-iOS-IPA
          path: AnlikPOS-Mobile-iOS.ipa
