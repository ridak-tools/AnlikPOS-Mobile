workflows:
  ios-ipa:
    name: AnlikPOS iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: 1. Install Dependencies
        script: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/ios@latest @capacitor/cli@latest --save --legacy-peer-deps
      - name: 2. Build Web App
        script: |
          npm run build
      - name: 3. Create Fresh iOS Project & Sync
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Build iOS Xcode App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: 5. Create IPA Package
        script: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "HATA: App.app bulunamadi!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r AnlikPOS-Mobile-iOS.ipa Payload
    artifacts:
      - AnlikPOS-Mobile-iOS.ipa
